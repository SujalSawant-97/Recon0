spring.application.name=Recon0
#server.port=8081

#Postgresql Configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/Recon0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HikariCP Configuration Optimized for Neon Serverless Auto-Suspend
# 1. Allow pool to shrink to 0 connections when idle so Neon can auto-suspend
spring.datasource.hikari.minimum-idle=0
# 2. Close idle connections after 60 seconds of inactivity (Neon suspends after 5 min of no connections)
spring.datasource.hikari.idle-timeout=60000
# 3. 30-second timeout to allow Neon to wake up from cold-start sleep without errors
spring.datasource.hikari.connection-timeout=30000
# 4. Limit pool size to conserve compute
spring.datasource.hikari.maximum-pool-size=5
# 5. Recycle connections cleanly before Neon's proxy drops them
spring.datasource.hikari.max-lifetime=600000
# 6. Fast validation timeout
spring.datasource.hikari.validation-timeout=5000
# 7. Disable keep-alive pings so background heartbeats don't keep Neon awake
spring.datasource.hikari.keepalive-time=0

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


